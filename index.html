<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evening Gentle Yoga</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Nunito:wght@300;400;600&display=swap');

  :root {
    --bg-deep: #0f1a2e;
    --bg-mid: #162240;
    --bg-card: rgba(255,255,255,0.04);
    --text-primary: #e8ddd0;
    --text-secondary: #8a9bb5;
    --text-dim: #546380;
    --accent-warm: #d4a574;
    --accent-glow: #e8c9a0;
    --accent-breath: #7ba5c4;
    --border-subtle: rgba(255,255,255,0.06);
    --shadow-soft: 0 8px 32px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Gradient background */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(123,165,196,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(212,165,116,0.06) 0%, transparent 50%),
      linear-gradient(170deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    z-index: -1;
  }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 2.4rem;
    letter-spacing: 0.02em;
    color: var(--accent-glow);
    margin-bottom: 6px;
  }

  header p {
    font-weight: 300;
    font-size: 0.9rem;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }

  /* Breath circle */
  .breath-container {
    display: flex;
    justify-content: center;
    margin: 30px 0;
    position: relative;
    height: 180px;
    align-items: center;
  }

  .breath-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 1.5px solid var(--accent-breath);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    color: var(--accent-breath);
    transition: transform 4s ease-in-out, box-shadow 4s ease-in-out;
    background: rgba(123,165,196,0.03);
  }

  .breath-circle.inhale {
    transform: scale(1.35);
    box-shadow: 0 0 40px rgba(123,165,196,0.15);
  }

  .breath-circle.exhale {
    transform: scale(1);
    box-shadow: 0 0 10px rgba(123,165,196,0.05);
  }

  /* Progress */
  .progress-bar-container {
    margin: 24px 0;
    background: var(--border-subtle);
    border-radius: 100px;
    height: 4px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-breath), var(--accent-warm));
    border-radius: 100px;
    width: 0%;
    transition: width 0.5s ease;
  }

  .time-display {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 30px;
    letter-spacing: 0.08em;
  }

  /* Current pose card */
  .pose-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(8px);
    min-height: 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: opacity 0.5s ease;
  }

  .pose-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent-warm);
    margin-bottom: 10px;
  }

  .pose-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 12px;
  }

  .pose-instruction {
    font-weight: 300;
    font-size: 0.92rem;
    line-height: 1.65;
    color: var(--text-secondary);
  }

  .pose-timer {
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 30px;
  }

  .btn {
    font-family: 'Nunito', sans-serif;
    font-weight: 400;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    padding: 12px 32px;
    border-radius: 100px;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent-warm), var(--accent-glow));
    color: var(--bg-deep);
  }

  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(212,165,116,0.3);
  }

  .btn-secondary {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border-subtle);
  }

  .btn-secondary:hover {
    border-color: var(--accent-breath);
    color: var(--accent-breath);
  }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
    box-shadow: none !important;
  }

  /* Voice settings */
  .settings {
    margin-top: 28px;
    padding: 20px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
  }

  .settings summary {
    font-size: 0.8rem;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    cursor: pointer;
    text-transform: uppercase;
    list-style: none;
  }

  .settings summary::-webkit-details-marker { display: none; }

  .settings-inner {
    margin-top: 16px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .setting-row label {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .setting-row select,
  .setting-row input[type="range"] {
    background: var(--bg-mid);
    color: var(--text-primary);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.82rem;
    font-family: 'Nunito', sans-serif;
  }

  input[type="range"] {
    width: 100px;
    accent-color: var(--accent-warm);
  }

  /* Up next */
  .up-next {
    margin-top: 16px;
    font-size: 0.78rem;
    color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.04em;
  }

  .up-next span {
    color: var(--text-secondary);
  }

  /* Idle state */
  .idle-message {
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-style: italic;
    color: var(--text-secondary);
    line-height: 1.7;
    padding: 20px 0;
  }

  .pose-list-preview {
    margin-top: 24px;
  }

  .pose-list-preview h3 {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    margin-bottom: 12px;
    text-align: center;
  }

  .pose-list-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 0.85rem;
  }

  .pose-list-item .name { color: var(--text-secondary); }
  .pose-list-item .dur { color: var(--text-dim); font-size: 0.78rem; }

  .completed-msg {
    text-align: center;
    padding: 30px 0;
  }

  .completed-msg h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 1.8rem;
    color: var(--accent-glow);
    margin-bottom: 10px;
  }

  .completed-msg p {
    font-weight: 300;
    color: var(--text-secondary);
    font-size: 0.9rem;
  }

  /* Wake lock toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .toggle-row label {
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .toggle-row .toggle-hint {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .toggle-switch {
    position: relative;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }

  .toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg-mid);
    border: 1px solid var(--border-subtle);
    border-radius: 24px;
    transition: 0.25s ease;
  }

  .toggle-slider::before {
    content: '';
    position: absolute;
    height: 18px;
    width: 18px;
    left: 2px;
    bottom: 2px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: 0.25s ease;
  }

  .toggle-switch input:checked + .toggle-slider {
    background: rgba(212,165,116,0.2);
    border-color: var(--accent-warm);
  }

  .toggle-switch input:checked + .toggle-slider::before {
    transform: translateX(20px);
    background: var(--accent-warm);
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Evening Gentle Yoga</h1>
    <p>stretching &amp; breathing · ~16 minutes</p>
  </header>

  <div class="breath-container">
    <div class="breath-circle" id="breathCircle">breathe</div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="time-display" id="timeDisplay">0:00 / ~16:00</div>

  <div id="mainContent">
    <div class="pose-card" id="poseCard" style="display:none;">
      <div class="pose-label" id="poseLabel">current pose</div>
      <div class="pose-name" id="poseName"></div>
      <div class="pose-instruction" id="poseInstruction"></div>
      <div class="pose-timer" id="poseTimer"></div>
    </div>
    <div class="up-next" id="upNext" style="display:none;">
      up next: <span id="upNextName"></span>
    </div>

    <div id="idleView">
      <div class="idle-message">
        A gentle sequence of stretches<br>and mindful breathing to close your day.
      </div>
      <div class="pose-list-preview" id="poseListPreview"></div>
    </div>

    <div id="completedView" style="display:none;" class="completed-msg">
      <h2>Namaste</h2>
      <p>Rest here as long as you like.</p>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart">Begin</button>
    <button class="btn btn-secondary" id="btnPause" style="display:none;">Pause</button>
    <button class="btn btn-secondary" id="btnStop" style="display:none;">Stop</button>
  </div>

  <details class="settings">
    <summary>voice &amp; speed settings</summary>
    <div class="settings-inner">
      <div class="toggle-row">
        <div>
          <label>Keep screen awake</label>
          <div class="toggle-hint" id="wakeLockHint">prevents sleep during session</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="wakeLockToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <label>Voice</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="setting-row">
        <label>Speed</label>
        <input type="range" id="rateSlider" min="0.6" max="1.2" step="0.05" value="0.85">
      </div>
      <div class="setting-row">
        <label>Pitch</label>
        <input type="range" id="pitchSlider" min="0.7" max="1.3" step="0.05" value="1.0">
      </div>
    </div>
  </details>
</div>

<script>
// ── Sequence: gentle stretches & breathing only, ~16 min ──
// All left/right sides are separate steps with equal timing
const sequence = [
  {
    name: "Arriving",
    duration: 20,
    speech: "Welcome. Find a comfortable cross-legged seated position. Let your hands rest on your knees. Close your eyes if that feels comfortable. Take a moment to arrive here.",
    breath: "slow"
  },
  {
    name: "Deep Breathing",
    duration: 45,
    speech: "When you're ready, place your hands on the floor behind you and slowly lower yourself down onto your back. Let your legs extend long. Let your arms rest by your sides, palms facing upward if that's comfortable. Begin to deepen your breath. Breathe in slowly through your nose, feeling your belly rise. And breathe out slowly through your mouth, feeling your belly fall. Let each exhale be a little longer than the inhale. With every breath out, let your body soften a little more into the floor.",
    breath: "guided"
  },
  {
    name: "Right Knee to Chest",
    duration: 40,
    speech: "Gently draw your right knee in toward your chest. Interlace your fingers around your right shin or behind your right thigh. Keep your left leg long on the floor, or bend it if that's more comfortable. Breathe into any sensation you feel in your right hip and lower back. There's no need to pull hard. Just hold gently and breathe.",
    breath: "slow"
  },
  {
    name: "Left Knee to Chest",
    duration: 40,
    speech: "Slowly release your right leg back down. Now draw your left knee in toward your chest. Interlace your fingers around your left shin or behind your left thigh. Keep your right leg long or bent, whatever feels better. Breathe into your left hip and lower back. Same gentle hold, same slow breathing.",
    breath: "slow"
  },
  {
    name: "Both Knees to Chest",
    duration: 30,
    speech: "Now draw both knees in toward your chest. Wrap your arms around your shins and gently rock side to side, massaging your lower back against the floor. Let this feel easy, like you're rocking yourself. Keep breathing slowly and deeply.",
    breath: "slow"
  },
  {
    name: "Supine Twist — Right Side",
    duration: 45,
    speech: "With both knees still bent, let your knees fall gently to the right side. Open your left arm out to the left. Turn your gaze toward your left hand if your neck allows. Breathe into the gentle twist through your spine. Let gravity do the work. You don't need to force your knees to the floor. Stay here, breathing slowly.",
    breath: "slow"
  },
  {
    name: "Supine Twist — Left Side",
    duration: 45,
    speech: "Slowly bring your knees back to centre. Now let them fall gently to the left side. Open your right arm out to the right. Turn your gaze toward your right hand if that feels comfortable. Breathe into this side. Same gentle twist, same slow breath. Let gravity do the work.",
    breath: "slow"
  },
  {
    name: "Bound Angle — Hands Behind",
    duration: 30,
    speech: "Slowly bring your knees back to centre. Roll to one side and come up to a seated position. Bring the soles of your feet together and let your knees fall open to the sides, like a butterfly. Draw your heels in as close to your body as is comfortable. Now place your hands on the floor behind you, fingertips pointing away. Press gently into your hands to lift your chest and lengthen your spine. Let the weight of your knees fall toward the floor. Don't push them down, just let gravity open your hips. Breathe here.",
    breath: "slow"
  },
  {
    name: "Bound Angle — Hands on Ankles",
    duration: 30,
    speech: "Keeping your feet together and knees wide, bring your hands forward and hold gently onto your ankles or your feet. Sit up tall, lengthening through the crown of your head. Keep your shoulders relaxed and away from your ears. Feel the opening through your inner thighs and hips. Breathe slowly and steadily.",
    breath: "slow"
  },
  {
    name: "Seated Twist — Left",
    duration: 40,
    speech: "From bound angle, keep your right leg where it is, sole of foot resting against your inner thigh. Lift your left knee up so it points toward the ceiling, and place your left foot flat on the floor in front of your right leg. Wrap your right arm around your left knee, hugging it gently. Place your left hand on the floor behind you. On an inhale, sit up tall. On an exhale, gently twist to the left. Let your breath guide you deeper only if your body wants to go. Stay here, breathing.",
    breath: "slow"
  },
  {
    name: "Seated Twist — Right",
    duration: 40,
    speech: "Slowly release and come back to bound angle, soles of feet together, knees wide. Now keep your left leg where it is. Lift your right knee up toward the ceiling and place your right foot flat on the floor in front of your left leg. Wrap your left arm around your right knee. Place your right hand on the floor behind you. Inhale, sit tall. Exhale, gently twist to the right. Same gentle rotation on this side. Breathe slowly.",
    breath: "slow"
  },
  {
    name: "Seated Forward Fold — Right Leg",
    duration: 30,
    speech: "Slowly release the twist and come back to centre. Straighten both legs out in front of you for a moment, giving yourself a gentle shake to release. Now extend your right leg straight out and flex your right foot. Bend your left knee and place the sole of your left foot flat against your right inner thigh. Inhale and raise both arms overhead, sitting up tall. As you exhale, slowly fold forward over your right leg. Reach toward your shin, ankle, or foot, wherever you land. Never force it. Let your head be heavy. Breathe into the stretch along the back of your right leg.",
    breath: "slow"
  },
  {
    name: "Seated Forward Fold — Left Leg",
    duration: 30,
    speech: "Slowly come back up. Now extend your left leg straight out and flex your left foot. Bend your right knee and place the sole of your right foot flat against your left inner thigh. Inhale, raise both arms overhead, sitting tall. Exhale, slowly fold forward over your left leg. Same gentle reach. Same easy breath. Let gravity help you, never forcing. Hold here and breathe.",
    breath: "slow"
  },
  {
    name: "Seated Forward Fold — Both Legs",
    duration: 45,
    speech: "Slowly come back up. Now extend both legs out in front of you. Flex both feet. On an inhale, reach your arms up and lengthen your spine. On an exhale, fold gently forward from your hips, reaching toward your shins, ankles, or feet. Wherever your hands land is perfect. Let your head be heavy. Breathe into the stretch along the back of both legs. Soften with each exhale.",
    breath: "slow"
  },
  {
    name: "Neck Stretch — Forward",
    duration: 30,
    speech: "Slowly come up from your fold. Draw your legs in and cross them, finding a comfortable cross-legged position. Let your spine be tall but relaxed. Gently let your chin drop toward your chest. Feel the stretch along the back of your neck and into your upper back. You can let the weight of your head be heavy. Breathe slowly into the stretch. No need to push or pull, just let gravity lengthen the back of your neck.",
    breath: "slow"
  },
  {
    name: "Neck Stretch — Right Side",
    duration: 30,
    speech: "From here, slowly roll your head to the right, bringing your right ear toward your right shoulder. Pause here and breathe. Feel the stretch along the left side of your neck.",
    breath: "slow"
  },
  {
    name: "Neck Stretch — Left Side",
    duration: 30,
    speech: "Slowly roll your head forward, chin toward chest, passing through centre. Continue rolling to the left side, bringing your left ear toward your left shoulder. Pause and breathe. Feel the stretch along the right side of your neck. There's no rush. Let this be slow and easy.",
    breath: "slow"
  },
  {
    name: "Neck Stretch — Throat",
    duration: 15,
    speech: "Slowly bring your head back to centre. Now gently let your head drop back, looking straight up toward the ceiling. Feel a gentle stretch across the front of your throat and chest. Keep your jaw relaxed. Breathe softly. Hold here for just a few moments.",
    breath: "slow"
  },
  {
    name: "Eagle Arms — Right Under",
    duration: 30,
    speech: "Bring your head back to centre. Reach both arms up overhead in a wide V shape. Sweep them forward and straight out in front of you. Now cross your right arm under your left at the elbows. Bend both elbows and wind your forearms around each other, bringing your palms to face each other, or as close as they'll come. Gently lift your elbows upward while keeping your shoulders relaxed and away from your ears. Feel the stretch deep between your shoulder blades and across your upper back. Breathe into the opening. Hold here.",

  },
  {
    name: "Eagle Arms — Left Under",

    breath: "slow"
  },
  {
    name: "Cat-Cow Stretch",
    duration: 55,
    speech: "From your seated position, lean forward and come onto your hands and knees into tabletop position. Place your hands about shoulder width apart, fingers spread wide, wrists directly under your shoulders. Bring your knees hip width apart, directly under your hips. Take a moment to settle here. Your back is flat like a table, gaze down between your hands. When you're ready, on your inhale, gently drop your belly toward the floor, lift your chest and gaze slightly up. This is cow pose. On your exhale, round your spine toward the ceiling, tuck your chin, draw your belly in. This is cat. Continue flowing between these two, led by your breath. Inhale, open. Exhale, round. Move as slowly as feels good.",
    breath: "guided"
  },
  {
    name: "Child's Pose",
    duration: 30,
    speech: "From hands and knees, sink your hips back toward your heels. Extend your arms forward on the floor, or bring them alongside your body, whatever feels more restful. Let your forehead rest on the floor or on your hands. This is child's pose. Let your whole back body expand with each breath in. Let everything release with each breath out. Rest here.",
    breath: "slow"
  },
  {
    name: "Side Stretch — Right",
    duration: 40,
    speech: "Slowly come up from child's pose and find a comfortable cross-legged seated position. Walk your right fingertips out along the floor to the right, away from your body. Raise your left arm straight up toward the ceiling. On an inhale, reach up tall through your left hand. On an exhale, gently begin to stretch up and over to the right, only as far as feels comfortable. If you can, turn your gaze slightly upward toward your left arm. Breathe into the stretch along your entire left side. Stay here, breathing slowly. When it's time, gradually release and lower your left arm down.",
    breath: "slow"
  },
  {
    name: "Side Stretch — Left",
    duration: 40,
    speech: "Come back to centre. Now walk your left fingertips out along the floor to the left. Raise your right arm straight up toward the ceiling. On an inhale, reach up tall through your right hand. On an exhale, gently stretch up and over to the left, only as far as is comfortable. Turn your gaze slightly upward toward your right arm if you can. Breathe into the stretch along your entire right side. Stay here. When it's time, gradually release and lower your right arm down.",
    breath: "slow"
  },
  {
    name: "Body Scan & Rest",
    duration: 45,
    speech: "Gently lower your arms and come back to centre. Place your hands on the floor behind you and slowly lean back, lowering yourself down onto your back. Let your legs extend long, feet falling open. Arms away from your body, palms up. Close your eyes. Scan through your body from your feet to the crown of your head. Wherever you notice tension, invite it to soften. Rest here. Breathing naturally. Just being.",
    breath: "natural"
  },
  {
    name: "Slowly Rising",
    duration: 25,
    speech: "Begin to wiggle your fingers and toes. Take a deeper breath in. Stretch your arms overhead. Draw your knees in toward your chest, roll to one side, and when you're ready, press yourself up to a seated position.",
    breath: "natural"
  },
  {
    name: "Closing",
    duration: 15,
    speech: "Bring your palms together at your heart. One final deep breath in. And let it go. Namaste.",
    breath: "natural"

];

// ── State ──
let currentStep = -1;
let isRunning = false;
let isPaused = false;
let stepTimer = null;
let stepElapsed = 0;
let totalElapsed = 0;
let breathInterval = null;
let totalDuration = sequence.reduce((s, p) => s + p.duration, 0);

// ── Wake Lock ──
// Phase 1 minimal fix (see scratch/refactor-plan/02-wake-lock-investigation.md):
//   - Audio-fallback path deleted (never worked; Web Audio requires user activation
//     that the preceding awaited wakeLock.request() has already consumed)
//   - release() is now awaited so the OS actually sees the explicit release
//     before the tab suspends. This fixes the just-breathe leak (§2a).
// Phase 5b will lift this into js/wake-lock.js as a proper module with pagehide
// handling, split wantsLock/lock state, and unit tests.
let wakeLockSentinel = null;
const hasWakeLockAPI = 'wakeLock' in navigator;

async function acquireWakeLock() {
  const toggle = document.getElementById('wakeLockToggle');
  if (!toggle.checked) return;

  if (!hasWakeLockAPI) {
    document.getElementById('wakeLockHint').textContent = 'wake lock not supported in this browser';
    return;
  }

  try {
    wakeLockSentinel = await navigator.wakeLock.request('screen');
    wakeLockSentinel.addEventListener('release', () => {
      // Re-acquire if the session is still running (e.g. tab was hidden then shown)
      if (isRunning && !isPaused && toggle.checked) {
        acquireWakeLock();
      }
    });
    document.getElementById('wakeLockHint').textContent = 'screen will stay awake';
  } catch (e) {
    // Most common cause: not a secure context. Wake Lock requires HTTPS or localhost.
    document.getElementById('wakeLockHint').textContent = 'could not prevent sleep — needs HTTPS';
  }
}

async function releaseWakeLock() {
  if (wakeLockSentinel) {
    const sentinel = wakeLockSentinel;
    wakeLockSentinel = null;
    try {
      await sentinel.release();
    } catch (e) {
      // Already released or never held — ignore.
    }
  }
  document.getElementById('wakeLockHint').textContent = 'prevents sleep during session';
}

// Re-acquire wake lock when tab becomes visible again
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && isRunning && !isPaused) {
    acquireWakeLock();
  }
});

// ── Speech ──
const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth.getVoices();
  const sel = document.getElementById('voiceSelect');
  sel.innerHTML = '';
  // prefer English voices
  const eng = voices.filter(v => v.lang.startsWith('en'));
  const list = eng.length > 0 ? eng : voices;
  list.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = voices.indexOf(v);
    opt.textContent = `${v.name} (${v.lang})`;
    // prefer a female / gentle voice
    if (v.name.toLowerCase().includes('samantha') || v.name.toLowerCase().includes('karen') || v.name.toLowerCase().includes('fiona') || v.name.toLowerCase().includes('female')) {
      opt.selected = true;
    }
    sel.appendChild(opt);
  });
}

synth.onvoiceschanged = loadVoices;
loadVoices();

function speak(text) {
  return new Promise(resolve => {
    synth.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    const vi = document.getElementById('voiceSelect').value;
    if (voices[vi]) utt.voice = voices[vi];
    utt.rate = parseFloat(document.getElementById('rateSlider').value);
    utt.pitch = parseFloat(document.getElementById('pitchSlider').value);
    utt.onend = resolve;
    utt.onerror = resolve;
    synth.speak(utt);
  });
}

// ── Breath animation ──
function startBreathCycle(type) {
  stopBreathCycle();
  const circle = document.getElementById('breathCircle');
  if (type === 'natural') {
    circle.textContent = 'breathe';
    return;
  }
  let inhaling = true;
  function cycle() {
    if (inhaling) {
      circle.className = 'breath-circle inhale';
      circle.textContent = 'inhale';
    } else {
      circle.className = 'breath-circle exhale';
      circle.textContent = 'exhale';
    }
    inhaling = !inhaling;
  }
  cycle();
  breathInterval = setInterval(cycle, 4500);
}

function stopBreathCycle() {
  clearInterval(breathInterval);
  const circle = document.getElementById('breathCircle');
  circle.className = 'breath-circle';
  circle.textContent = 'breathe';
}

// ── UI updates ──
function updateTime() {
  const elapsed = Math.floor(totalElapsed);
  const em = Math.floor(elapsed / 60);
  const es = elapsed % 60;
  const tm = Math.floor(totalDuration / 60);
  const ts = totalDuration % 60;
  document.getElementById('timeDisplay').textContent =
    `${em}:${String(es).padStart(2,'0')} / ${tm}:${String(ts).padStart(2,'0')}`;
  document.getElementById('progressBar').style.width =
    `${(totalElapsed / totalDuration) * 100}%`;
}

function showPose(step) {
  const pose = sequence[step];
  document.getElementById('poseCard').style.display = '';
  document.getElementById('poseLabel').textContent = `${step + 1} of ${sequence.length}`;
  document.getElementById('poseName').textContent = pose.name;
  document.getElementById('poseInstruction').textContent = '';
  document.getElementById('poseTimer').textContent = `${Math.ceil(pose.duration / 60)} min`;

  if (step < sequence.length - 1) {
    document.getElementById('upNext').style.display = '';
    document.getElementById('upNextName').textContent = sequence[step + 1].name;
  } else {
    document.getElementById('upNext').style.display = 'none';
  }
}

// ── Sequence runner ──
async function runStep(step) {
  if (step >= sequence.length) {
    await finish();
    return;
  }
  currentStep = step;
  const pose = sequence[step];
  showPose(step);
  startBreathCycle(pose.breath);

  await speak(pose.speech);

  // remaining hold time after speech
  stepElapsed = 0;
  return new Promise(resolve => {
    stepTimer = setInterval(() => {
      if (!isPaused) {
        stepElapsed += 0.5;
        totalElapsed += 0.5;
        updateTime();
      }
    }, 500);

    // wait the full duration (speech time counts toward it, but we ensure at least
    // a few seconds of silence after speech for breathing)
    const holdTime = Math.max(pose.duration * 1000, 5000);
    let waited = 0;
    const checkDone = setInterval(() => {
      if (!isPaused) waited += 300;
      if (waited >= holdTime) {
        clearInterval(stepTimer);
        clearInterval(checkDone);
        resolve();
      }
    }, 300);
  });
}

async function runSequence() {
  for (let i = 0; i < sequence.length; i++) {
    if (!isRunning) break;
    await runStep(i);
  }
  if (isRunning) await finish();
}

async function finish() {
  isRunning = false;
  isPaused = false;
  stopBreathCycle();
  synth.cancel();
  clearInterval(stepTimer);
  await releaseWakeLock();
  document.getElementById('poseCard').style.display = 'none';
  document.getElementById('upNext').style.display = 'none';
  document.getElementById('idleView').style.display = 'none';
  document.getElementById('completedView').style.display = '';
  document.getElementById('btnStart').textContent = 'Restart';
  document.getElementById('btnStart').style.display = '';
  document.getElementById('btnPause').style.display = 'none';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
}

// ── Controls ──
document.getElementById('btnStart').addEventListener('click', () => {
  if (isRunning) return;
  isRunning = true;
  isPaused = false;
  totalElapsed = 0;
  currentStep = -1;
  document.getElementById('idleView').style.display = 'none';
  document.getElementById('completedView').style.display = 'none';
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnPause').style.display = '';
  document.getElementById('btnStop').style.display = '';
  updateTime();
  acquireWakeLock();
  runSequence();
});

document.getElementById('btnPause').addEventListener('click', () => {
  isPaused = !isPaused;
  document.getElementById('btnPause').textContent = isPaused ? 'Resume' : 'Pause';
  if (isPaused) {
    synth.pause();
  } else {
    synth.resume();
  }
});

document.getElementById('btnStop').addEventListener('click', async () => {
  isRunning = false;
  isPaused = false;
  synth.cancel();
  clearInterval(stepTimer);
  stopBreathCycle();
  await releaseWakeLock();
  document.getElementById('poseCard').style.display = 'none';
  document.getElementById('upNext').style.display = 'none';
  document.getElementById('idleView').style.display = '';
  document.getElementById('completedView').style.display = 'none';
  document.getElementById('btnStart').textContent = 'Begin';
  document.getElementById('btnStart').style.display = '';
  document.getElementById('btnPause').style.display = 'none';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('progressBar').style.width = '0%';
  totalElapsed = 0;
  updateTime();
});

// ── Build pose list preview ──
function buildPreview() {
  const container = document.getElementById('poseListPreview');
  let html = '<h3>Sequence</h3>';
  sequence.forEach(p => {
    const mins = p.duration >= 60 ? `${Math.floor(p.duration/60)}m` : '';
    const secs = p.duration % 60 > 0 ? `${p.duration % 60}s` : '';
    html += `<div class="pose-list-item"><span class="name">${p.name}</span><span class="dur">${mins}${mins && secs ? ' ' : ''}${secs}</span></div>`;
  });
  container.innerHTML = html;
}

buildPreview();
updateTime();
</script>
</body>
</html>
