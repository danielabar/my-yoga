<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Evening Gentle Yoga</title>
<link rel="stylesheet" href="./css/index.css">
<script>
  // Restore URL after 404.html SPA redirect (GitHub Pages).
  // Must run before the router module so the URL is correct when it starts.
  (function () {
    var redirect = sessionStorage.getItem("redirect");
    if (redirect) {
      sessionStorage.removeItem("redirect");
      history.replaceState(null, "", redirect);
    }
  })();
</script>
<script type="module" src="./js/app.js"></script>
</head>
<body>

  <header class="app-header">
    <h1 class="app-header__title">Evening Gentle Yoga</h1>
    <p class="app-header__subtitle">stretching &amp; breathing · ~16 minutes</p>
    <nav>
      <a href="./" data-route="/">Practice</a>
      <a href="about" data-route="/about">About</a>
    </nav>
  </header>

  <main id="content" class="container">
  </main>

</body>
</html>
