<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <script>
    // SPA 404 fallback for GitHub Pages.
    // Store the intended path in sessionStorage so the router can honour
    // deep links (e.g. /about). The inline script in index.html reads this
    // back and calls history.replaceState before the router starts.
    sessionStorage.setItem("redirect", location.pathname + location.search);
    var repoName = "my-yoga";
    var segments = location.pathname.split("/").filter(Boolean);
    var basePath = segments[0] === repoName ? "/" + repoName + "/" : "/";
    location.replace(basePath);
  </script>
</head>
<body></body>
</html>
